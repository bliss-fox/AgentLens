[project]
name = "agentlens"
version = "0.1.0"
description = "Controlled agent evaluation and reproducibility platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "numpy>=2.0,<3",
  "openai>=1.60,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75,<100", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
