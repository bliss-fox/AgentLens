[project]
name = "agentlens"
version = "0.1.0"
description = "Controlled agent evaluation and reproducibility platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "arq>=0.26",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "numpy>=2.0",
  "openai>=1.60",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
