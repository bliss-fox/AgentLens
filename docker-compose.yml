services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentlens
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: agentlens
    volumes: [agentlens_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control]
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes: [agentlens_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [control]
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://agentlens:agentlens@postgres:5432/agentlens
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [control]
  tool-runner:
    build: ./tool_runner
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [control]
  candidate-agent:
    build: ./candidate_agent
    environment:
      CANDIDATE_FAKE_MODEL: ${CANDIDATE_FAKE_MODEL:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_INPUT_PRICE_CNY_PER_MILLION: ${LLM_INPUT_PRICE_CNY_PER_MILLION:-2}
      LLM_OUTPUT_PRICE_CNY_PER_MILLION: ${LLM_OUTPUT_PRICE_CNY_PER_MILLION:-8}
      LLM_CACHED_PRICE_CNY_PER_MILLION: ${LLM_CACHED_PRICE_CNY_PER_MILLION:-0.5}
      LLM_TOOL_COST_CNY: ${LLM_TOOL_COST_CNY:-0}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      tool-runner: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [control, model]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agentlens:agentlens@postgres:5432/agentlens
      REDIS_URL: redis://redis:6379/0
      AGENT_ENDPOINTS: '${AGENT_ENDPOINTS:-{"coding-assistant-v1":"http://candidate-agent:8100"}}'
      CANDIDATE_OVERRIDES: '${CANDIDATE_OVERRIDES:-{}}'
      ENVIRONMENT_SNAPSHOT: coding-agent-v1:runner-2026-09-14
      TOOL_GATEWAY_URL: http://api:8000/api/v1/tools/invoke
      TOOL_RUNNER_URL: http://tool-runner:8200
      TOOL_RUNNER_TIMEOUT_SECONDS: ${TOOL_RUNNER_TIMEOUT_SECONDS:-25}
      EXECUTION_BACKEND: arq
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-deepseek}
      JUDGE_MODEL: ${JUDGE_MODEL:-deepseek-chat}
      JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-60}
      JUDGE_MAX_CONTEXT_BYTES: ${JUDGE_MAX_CONTEXT_BYTES:-131072}
      TOOL_GRANT_RETENTION_SECONDS: ${TOOL_GRANT_RETENTION_SECONDS:-604800}
      TOOL_GRANT_CLEANUP_BATCH_SIZE: ${TOOL_GRANT_CLEANUP_BATCH_SIZE:-1000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      worker: { condition: service_healthy }
      candidate-agent: { condition: service_healthy }
      tool-runner: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [control, model]
  worker:
    build: ./backend
    command: arq agentlens.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+psycopg://agentlens:agentlens@postgres:5432/agentlens
      REDIS_URL: redis://redis:6379/0
      AGENT_ENDPOINTS: '${AGENT_ENDPOINTS:-{"coding-assistant-v1":"http://candidate-agent:8100"}}'
      CANDIDATE_OVERRIDES: '${CANDIDATE_OVERRIDES:-{}}'
      ENVIRONMENT_SNAPSHOT: coding-agent-v1:runner-2026-09-14
      TOOL_GATEWAY_URL: http://api:8000/api/v1/tools/invoke
      TOOL_RUNNER_URL: http://tool-runner:8200
      TOOL_RUNNER_TIMEOUT_SECONDS: ${TOOL_RUNNER_TIMEOUT_SECONDS:-25}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-deepseek}
      JUDGE_MODEL: ${JUDGE_MODEL:-deepseek-chat}
      JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-60}
      JUDGE_MAX_CONTEXT_BYTES: ${JUDGE_MAX_CONTEXT_BYTES:-131072}
      TOOL_GRANT_RETENTION_SECONDS: ${TOOL_GRANT_RETENTION_SECONDS:-604800}
      TOOL_GRANT_CLEANUP_BATCH_SIZE: ${TOOL_GRANT_CLEANUP_BATCH_SIZE:-1000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      candidate-agent: { condition: service_healthy }
      tool-runner: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "arq", "--check", "agentlens.worker.WorkerSettings"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [control, model]
  web:
    build: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:5173:80"]
    networks: [control, ingress]
volumes:
  agentlens_postgres:
  agentlens_redis:
networks:
  control:
    internal: true
  model:
  ingress:
